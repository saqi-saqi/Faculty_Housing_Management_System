version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: fhms-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: fhms
      MYSQL_USER: fhms_user
      MYSQL_PASSWORD: fhms_password
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./database/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-prootpassword"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  backend:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
    container_name: fhms-backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 5000
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: fhms_user
      DB_PASSWORD: fhms_password
      DB_NAME: fhms
      JWT_SECRET: super-secret-jwt-key-for-fhms-prod-2026-min32chars
      CORS_ORIGIN: http://localhost:80
    ports:
      - "5000:5000"

  frontend:
    build:
      context: .
      dockerfile: docker/Dockerfile.frontend
    container_name: fhms-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "80:80"

volumes:
  mysql_data:
    driver: local
